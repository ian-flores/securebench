url: https://ian-flores.github.io/securebench/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#f4ecdc"
    fg: "#2b1f12"
    primary: "#bf5a36"
    secondary: "#3f5d72"
    success: "#7c8a4e"
    warning: "#d4a03c"
    border-radius: 0
    border-color: "#cdb48a"
    base_font: {google: "Hanken Grotesk"}
    heading_font: {google: {family: "Fraunces", wght: [400, 500, 600]}}
    code_font: {google: "Space Mono"}
    font-size-base: 1.02rem
    line-height-base: 1.65

reference:
  - title: Guardrail Evaluation
    contents:
      - guardrail_eval_result_class
      - guardrail_eval
      - guardrail_metrics
      - guardrail_confusion
      - guardrail_compare

  - title: Reports
    contents:
      - guardrail_report

  - title: Integration
    contents:
      - benchmark_guardrail
      - benchmark_pipeline

  - title: Vitals Interop
    contents:
      - as_vitals_scorer

  - title: Bundled Reference Datasets
    contents:
      - load_reference
      - reference_datasets

footer:
  structure:
    left: titleblock
    right: built_with
  components:
    titleblock: >-
      <div class="title-block">
      <div><b>Sheet</b>4 of 4</div>
      <div><b>Quadrangle</b>securebench</div>
      <div><b>Survey</b>Benchmarks</div>
      <div><b>Series</b>secure-r-dev</div>
      </div>
